<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.38" cy="0.55" r="0.8">
      <stop offset="0" stop-color="#1a2136"/>
      <stop offset="1" stop-color="#05070d"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f5e6a8" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a4a"/>
      <stop offset="1" stop-color="#ff1a10" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- flashlight beam -->
  <path d="M262 300 L512 150 L512 460 Z" fill="url(#beam)"/>
  <!-- the Shadow's eyes in the dark corner -->
  <circle cx="392" cy="96" r="22" fill="url(#eye)"/>
  <circle cx="440" cy="96" r="22" fill="url(#eye)"/>
  <circle cx="392" cy="96" r="7" fill="#ffd2c8"/>
  <circle cx="440" cy="96" r="7" fill="#ffd2c8"/>
  <!-- watchman, top-down: shoulders, body, cap with brim and badge -->
  <g transform="translate(190 300) scale(1.35) translate(-190 -300)">
    <ellipse cx="190" cy="300" rx="62" ry="86" fill="#1c2a48"/>
    <circle cx="190" cy="300" r="64" fill="#2b4677"/>
    <circle cx="190" cy="300" r="42" fill="#152039"/>
    <rect x="222" y="268" width="22" height="64" rx="8" fill="#0d1426"/>
    <circle cx="210" cy="300" r="9" fill="#e7c766"/>
    <rect x="230" y="286" width="44" height="22" rx="6" fill="#3a3d46"/>
    <circle cx="274" cy="297" r="12" fill="#fff6d0"/>
  </g>
</svg>
